<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Join a challenge — Friendly Challenge</title>
  <!--
    MOVED. Friendly Challenge's pages are served from https://friendlychallenge.toilcompany.com
    (Firebase Hosting; the source is hosting/ in the app repository). This
    repository only redirects the old GitHub Pages addresses there, so
    links already shared keep working. Do not edit documents here.
  -->
  <link rel="canonical" href="https://friendlychallenge.toilcompany.com/">
  <meta http-equiv="refresh" content="0; url=https://friendlychallenge.toilcompany.com/">
  <script>
    (function () {
      var site = "https://friendlychallenge.toilcompany.com";
      var parts = location.pathname.split('/').filter(function (s) { return s; });
      if (parts[0] === 'friendlychallenge-legal') parts.shift();
      var to = site + '/';
      if (parts[0] === 'join') {
        var code = parts[1] || new URLSearchParams(location.search).get('c') || location.hash.slice(1);
        if (code) to = site + '/join/' + encodeURIComponent(decodeURIComponent(code));
      } else if (parts.length === 1) {
        var name = parts[0].toLowerCase().replace('.html', '');
        if (name === 'privacy' || name === 'terms' || name === 'delete-account') to = site + '/' + name;
      }
      location.replace(to);
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f5f7fa; color: #1a1a2e; text-align: center; padding: 4rem 1rem; }
    a { color: #2563EB; }
  </style>
</head>
<body>
  <p>This page has moved to <a href="https://friendlychallenge.toilcompany.com/">https://friendlychallenge.toilcompany.com/</a>.</p>
</body>
</html>
